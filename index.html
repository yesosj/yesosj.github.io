<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포트폴리오</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0;
      background-color: #222; /* 페이지 사이 틈새로 보일 어두운 배경색 */
      overflow-x: hidden; 
    }
    
    #pdf-container {
      width: 100%;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding-top: 10px; /* 맨 위 살짝 여백 */
      padding-bottom: 20px; /* 맨 아래 살짝 여백 */
    }
    
    .loading {
      color: #fff;
      margin-top: 40vh;
      font-family: 'Malgun Gothic', sans-serif;
      font-size: 16px;
    }

    /* 각 페이지를 감싸는 뼈대 */
    .page-wrapper {
      position: relative;
      width: 100%; /* 가로는 꽉 차게 유지 */
      margin-bottom: 20px; /* ⭐ 페이지와 페이지 사이의 간격 (구분선 역할) */
      background-color: white; 
      box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.6); /* ⭐ 페이지 하단에 입체적인 그림자 추가 */
    }

    /* 실제 PDF가 그려지는 그림판 */
    canvas { 
      width: 100%; 
      height: auto; 
      display: block; 
    }

    /* 캔버스 위에 올라가는 투명한 링크 레이어 */
    .annotation-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; 
    }

    /* 실제 클릭되는 a 태그 영역 */
    .annotation-layer a {
      position: absolute;
      pointer-events: auto; 
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <div id="loading" class="loading">포트폴리오를 불러오는 중입니다...</div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const url = '/PortFolio.pdf'; 

    pdfjsLib.getDocument(url).promise.then(pdf => {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('pdf-container');

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = 'page-wrapper-' + pageNum;
        container.appendChild(wrapper);

        pdf.getPage(pageNum).then(page => {
          const currentWrapper = document.getElementById('page-wrapper-' + pageNum);
          
          const baseViewport = page.getViewport({ scale: 1.0 });
          const renderScale = 2.5; // 초고화질 유지
          const renderViewport = page.getViewport({ scale: renderScale });
          
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = renderViewport.width;
          canvas.height = renderViewport.height;
          currentWrapper.appendChild(canvas);

          const renderContext = {
            canvasContext: ctx,
            viewport: renderViewport
          };
          
          page.render(renderContext).promise.then(() => {
            return page.getAnnotations();
          }).then(annotations => {
            if (!annotations || annotations.length === 0) return;
            
            const annotationLayer = document.createElement('div');
            annotationLayer.className = 'annotation-layer';
            currentWrapper.appendChild(annotationLayer);
            
            annotations.forEach(anno => {
              if (anno.subtype === 'Link' && anno.url) {
                const a = document.createElement('a');
                a.href = anno.url;
                a.target = '_blank';
                
                const rect = baseViewport.convertToViewportRectangle(anno.rect);
                
                const left = Math.min(rect[0], rect[2]);
                const top = Math.min(rect[1], rect[3]);
                const width = Math.abs(rect[0] - rect[2]);
                const height = Math.abs(rect[1] - rect[3]);
                
                a.style.left = (left / baseViewport.width * 100) + '%';
                a.style.top = (top / baseViewport.height * 100) + '%';
                a.style.width = (width / baseViewport.width * 100) + '%';
                a.style.height = (height / baseViewport.height * 100) + '%';
                
                annotationLayer.appendChild(a);
              }
            });
          });
        });
      }
    }).catch(error => {
      console.error('Error:', error);
      document.getElementById('loading').innerText = '포트폴리오를 불러올 수 없습니다.';
    });
  </script>
</body>
</html>
