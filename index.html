<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>포트폴리오 보기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body { 
      margin: 0; 
      background-color: #525659; /* PDF 뷰어의 일반적인 배경색 */
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    canvas { 
      max-width: 100%; 
      margin-bottom: 10px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .loading {
      color: white;
      margin-top: 20px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">PDF를 불러오는 중입니다...</div>
  <div id="pdf-container"></div>

  <script>
    // PDF.js worker 설정 (필수)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // PDF 파일 경로 (같은 서버에 있는 PORTFOLIO.pdf)
    const url = '/PORTFOLIO.pdf'; 

    pdfjsLib.getDocument(url).promise.then(pdf => {
      document.getElementById('loading').style.display = 'none'; // 로딩 메시지 숨김
      const container = document.getElementById('pdf-container');

      // PDF의 모든 페이지를 순회하며 화면에 그리기
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(page => {
          // 모바일에서도 선명하게 보이도록 스케일 조정
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          container.appendChild(canvas);

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };
          page.render(renderContext);
        });
      }
    }).catch(error => {
      console.error('PDF 로드 실패:', error);
      document.getElementById('loading').innerText = 'PDF를 불러올 수 없습니다. 직접 다운로드 해주세요.';
    });
  </script>
</body>
</html>
