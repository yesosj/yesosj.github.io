<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포트폴리오</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    /* 기본 여백을 모두 없애서 브라우저 끝까지 꽉 차게 만듭니다 */
    body { 
      margin: 0; 
      padding: 0;
      background-color: #000; 
      overflow-x: hidden; /* 가로 스크롤 방지 */
    }
    #pdf-container {
      width: 100%;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    .loading {
      color: #fff;
      margin-top: 40vh;
      font-family: 'Malgun Gothic', sans-serif;
      font-size: 16px;
    }

    /* 각 페이지를 감싸는 뼈대 - 100% 꽉 채우기 */
    .page-wrapper {
      position: relative;
      width: 100%; /* 좌우 여백 없이 100% 꽉 채움 */
      max-width: none; /* PC에서도 꽉 차도록 최대 너비 제한 해제 */
      margin-bottom: 0; /* 페이지 사이 여백 제거 (자연스럽게 이어짐) */
      background-color: white; 
    }

    /* 실제 PDF가 그려지는 그림판 */
    canvas { 
      width: 100%; 
      height: auto; 
      display: block; /* 캔버스 하단 빈 공간 제거 */
    }

    /* 캔버스 위에 올라가는 투명한 링크 레이어 */
    .annotation-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* 빈 공간 클릭은 통과시킴 */
    }

    /* 실제 클릭되는 a 태그 영역 */
    .annotation-layer a {
      position: absolute;
      pointer-events: auto; /* 링크 위치만 클릭 활성화 */
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <div id="loading" class="loading">포트폴리오를 불러오는 중입니다...</div>
  </div>

  <script>
    // PDF.js 워커 설정 (필수)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // 💡 요청하신 대소문자에 맞춘 파일 경로
    const url = '/PortFolio.pdf'; 

    pdfjsLib.getDocument(url).promise.then(pdf => {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('pdf-container');

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        // 순서 꼬임 방지를 위해 미리 뼈대(div) 생성
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = 'page-wrapper-' + pageNum;
        container.appendChild(wrapper);

        pdf.getPage(pageNum).then(page => {
          const currentWrapper = document.getElementById('page-wrapper-' + pageNum);
          
          // 1. 레이아웃 및 좌표 계산을 위한 기본 뷰포트
          const baseViewport = page.getViewport({ scale: 1.0 });
          
          // 2. 글씨 깨짐 방지를 위한 초고해상도 렌더링 배율 (2.5배 뻥튀기)
          const renderScale = 2.5; 
          const renderViewport = page.getViewport({ scale: renderScale });
          
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = renderViewport.width;
          canvas.height = renderViewport.height;
          currentWrapper.appendChild(canvas);

          const renderContext = {
            canvasContext: ctx,
            viewport: renderViewport
          };
          
          // 3. 캔버스 렌더링 후 링크 좌표 씌우기
          page.render(renderContext).promise.then(() => {
            return page.getAnnotations();
          }).then(annotations => {
            if (!annotations || annotations.length === 0) return;
            
            const annotationLayer = document.createElement('div');
            annotationLayer.className = 'annotation-layer';
            currentWrapper.appendChild(annotationLayer);
            
            annotations.forEach(anno => {
              if (anno.subtype === 'Link' && anno.url) {
                const a = document.createElement('a');
                a.href = anno.url;
                a.target = '_blank'; // 새 창으로 열기
                
                // PDF 내부 좌표를 퍼센트(%)로 변환하여 모바일/PC 화면 크기 변화에 대응
                const rect = baseViewport.convertToViewportRectangle(anno.rect);
                
                const left = Math.min(rect[0], rect[2]);
                const top = Math.min(rect[1], rect[3]);
                const width = Math.abs(rect[0] - rect[2]);
                const height = Math.abs(rect[1] - rect[3]);
                
                a.style.left = (left / baseViewport.width * 100) + '%';
                a.style.top = (top / baseViewport.height * 100) + '%';
                a.style.width = (width / baseViewport.width * 100) + '%';
                a.style.height = (height / baseViewport.height * 100) + '%';
                
                annotationLayer.appendChild(a);
              }
            });
          });
        });
      }
    }).catch(error => {
      console.error('Error:', error);
      document.getElementById('loading').innerText = '포트폴리오를 불러올 수 없습니다.';
    });
  </script>
</body>
</html>
