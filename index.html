<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포트폴리오</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0;
      background-color: #333; /* 포트폴리오가 돋보이도록 어두운 배경 */
    }
    #pdf-container {
      width: 100%;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding-top: 10px;
      padding-bottom: 30px;
    }
    .loading {
      color: #fff;
      margin-top: 40vh;
      font-family: sans-serif;
      font-size: 16px;
    }
    canvas { 
      max-width: 100%; /* 모바일 화면 너비에 맞춤 */
      height: auto !important; /* 너비에 맞춰 높이 비율 자동 조절 */
      margin-bottom: 15px; 
      background-color: white; /* PDF 로딩 전 하얀 바탕 */
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* 그림자 효과 */
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <div id="loading" class="loading">고화질 PDF를 불러오는 중입니다...</div>
  </div>

  <script>
    // PDF.js worker 설정
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // 같은 서버에 있는 PDF 파일 경로
    const url = '/PortFolio.pdf'; 

    pdfjsLib.getDocument(url).promise.then(pdf => {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('pdf-container');

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(page => {
          // 1. 현재 사용하는 기기의 디스플레이 픽셀 비율 (보통 2.0 ~ 3.0)
          const dpr = window.devicePixelRatio || 1;
          
          // 2. [핵심] 초고화질을 위한 강제 스케일업 (기본 1.0 -> 2.5배 확대)
          const renderScale = 2.5; 
          const viewport = page.getViewport({ scale: renderScale });
          
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          // 3. 캔버스의 '실제 내부 해상도'를 엄청나게 크게 설정
          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          
          // 4. 화면에 보여지는 'CSS 크기'는 1배율(원본) 크기로 고정하여 화질 압축
          const originalViewport = page.getViewport({ scale: 1.0 });
          canvas.style.width = originalViewport.width + 'px';
          
          container.appendChild(canvas);

          // 확대된 캔버스에 맞춰서 그리기 설정
          ctx.scale(dpr, dpr);

          const renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };
          
          page.render(renderContext);
        });
      }
    }).catch(error => {
      console.error('Error:', error);
      document.getElementById('loading').innerText = 'PDF를 불러올 수 없습니다.';
    });
  </script>
</body>
</html>
