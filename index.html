<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오</title>
  <style>
    /* 기본 여백 없애고 배경색 지정 */
    body { 
      margin: 0; 
      padding: 0;
      background-color: #222; /* 배경이 어두운 게 이미지가 돋보여. 하얀색을 원하면 #fff로 변경 */
      text-align: center; 
    }
    
    /* 이미지가 모바일 화면에 꽉 차게, 비율 유지 */
    .portfolio-page {
      width: 100%;
      max-width: 800px; /* PC에서 이미지가 너무 무식하게 커지는 것 방지 */
      height: auto;
      display: block;
      margin: 0 auto; /* PC 화면에서 가운데 정렬 */
      margin-bottom: 5px; /* 페이지 사이 약간의 틈 (딱 붙이고 싶으면 0으로 수정) */
    }
  </style>
</head>
<body>
  <img src="./images/page1.jpg" class="portfolio-page" alt="포트폴리오 1페이지" />
  <img src="./images/page2.jpg" class="portfolio-page" alt="포트폴리오 2페이지" />
  <img src="./images/page3.jpg" class="portfolio-page" alt="포트폴리오 3페이지" />
  
  </body>
</html>
