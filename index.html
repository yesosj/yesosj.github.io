<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>포트폴리오</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      background-color: #333; /* 포트폴리오가 돋보이는 어두운 배경 */
    }
    #pdf-container {
      width: 100%;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 10px 0 30px 0;
    }
    .loading {
      color: #fff;
      margin-top: 40vh;
      font-family: 'Malgun Gothic', sans-serif;
    }

    /* 각 페이지(캔버스+링크영역)를 감싸는 뼈대 */
    .page-wrapper {
      position: relative;
      width: 95%; /* 모바일 화면 좌우 여백 */
      max-width: 800px; /* PC에서 너무 커지는 것 방지 */
      margin-bottom: 15px;
      background-color: white; /* 렌더링 전 흰 바탕 */
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); /* 예쁜 그림자 */
    }

    /* 실제 PDF가 그려지는 그림판 */
    canvas { 
      width: 100%; 
      height: auto; 
      display: block; /* 하단 빈 공간 제거 */
    }

    /* 캔버스 위에 올라가는 투명한 링크 레이어 */
    .annotation-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* 빈 공간 클릭은 통과시킴 */
    }

    /* 실제 클릭되는 a 태그 영역 */
    .annotation-layer a {
      position: absolute;
      pointer-events: auto; /* 링크 위치만 클릭 활성화 */
      
      /* 💡 디버깅 꿀팁: 링크 위치가 잘 맞는지 보려면 아래 주석을 풀어보세요 */
      /* background-color: rgba(255, 255, 0, 0.3); */ 
    }
  </style>
</head>
<body>
  <div id="pdf-container">
    <div id="loading" class="loading">고화질 PDF를 불러오는 중입니다...</div>
  </div>

  <script>
    // PDF.js 워커 설정 (필수)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const url = '/PORTFOLIO.pdf'; // 내 깃허브 서버의 PDF 파일 경로

    pdfjsLib.getDocument(url).promise.then(pdf => {
      document.getElementById('loading').style.display = 'none';
      const container = document.getElementById('pdf-container');

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        // [중요] 페이지 렌더링 속도가 달라서 순서가 꼬이는 걸 방지하기 위해 뼈대(div)부터 순서대로 깔아둡니다.
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        wrapper.id = 'page-wrapper-' + pageNum;
        container.appendChild(wrapper);

        pdf.getPage(pageNum).then(page => {
          const currentWrapper = document.getElementById('page-wrapper-' + pageNum);
          
          // 1. 레이아웃 및 좌표 계산을 위한 1.0 배율의 뷰포트
          const baseViewport = page.getViewport({ scale: 1.0 });
          
          // 2. 글씨가 안 깨지게 하기 위한 고해상도 렌더링 배율 (2.5배 뻥튀기)
          const renderScale = 2.5; 
          const renderViewport = page.getViewport({ scale: renderScale });
          
          // 캔버스 생성 및 해상도 적용
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = renderViewport.width;
          canvas.height = renderViewport.height;
          currentWrapper.appendChild(canvas);

          const renderContext = {
            canvasContext: ctx,
            viewport: renderViewport
          };
          
          // 3. 그림(캔버스)을 먼저 화면에 그리고 난 후, 링크 좌표를 가져옵니다.
          page.render(renderContext).promise.then(() => {
            return page.getAnnotations();
          }).then(annotations => {
            if (!annotations || annotations.length === 0) return;
            
            // 링크를 담을 투명 레이어 생성
            const annotationLayer = document.createElement('div');
            annotationLayer.className = 'annotation-layer';
            currentWrapper.appendChild(annotationLayer);
            
            // 모든 주석 데이터를 돌면서 링크(Link)만 찾아내기
            annotations.forEach(anno => {
              if (anno.subtype === 'Link' && anno.url) {
                const a = document.createElement('a');
                a.href = anno.url;
                a.target = '_blank'; // 새 창으로 열기
                
                // PDF 내부의 좌표를 웹 브라우저 좌표로 변환
                const rect = baseViewport.convertToViewportRectangle(anno.rect);
                
                const left = Math.min(rect[0], rect[2]);
                const top = Math.min(rect[1], rect[3]);
                const width = Math.abs(rect[0] - rect[2]);
                const height = Math.abs(rect[1] - rect[3]);
                
                // 모바일 화면 크기에 맞춰서 유동적으로 위치를 잡기 위해 퍼센트(%) 단위로 변환
                a.style.left = (left / baseViewport.width * 100) + '%';
                a.style.top = (top / baseViewport.height * 100) + '%';
                a.style.width = (width / baseViewport.width * 100) + '%';
                a.style.height = (height / baseViewport.height * 100) + '%';
                
                annotationLayer.appendChild(a);
              }
            });
          });
        });
      }
    }).catch(error => {
      console.error('Error:', error);
      document.getElementById('loading').innerText = 'PDF를 불러올 수 없습니다.';
    });
  </script>
</body>
</html>
